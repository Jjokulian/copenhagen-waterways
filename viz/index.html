<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copenhagen Waterways</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#8b949e;
    --combined:#e8734a;   /* fælleskloak - sewage and rain share a pipe */
    --separate:#4a9de8;   /* separatkloak */
    --sewage:#c9a227;     /* spildevandskloak */
    --basin:#7ee0a8; --tunnel:#b07ee0; --outfall:#ff5c7a; --plant:#ffd166;
    --water:#1b3a5c; --lar:#5fd3bc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:0;left:0;bottom:0;width:310px;z-index:2;overflow-y:auto;
    background:rgba(22,27,34,.94);backdrop-filter:blur(8px);border-right:1px solid var(--line);
    padding:14px 14px 40px}
  .panel h1{font-size:15px;margin:0 0 2px;letter-spacing:.2px}
  .panel .sub{color:var(--dim);font-size:11px;margin-bottom:14px}
  .grp{margin-bottom:14px}
  .grp>h2{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
    margin:0 0 6px;font-weight:600}
  label.row{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
  label.row:hover{color:#fff}
  label.row input{accent-color:#4a9de8;margin:0}
  .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
  .sw.line{height:3px;border-radius:1px}
  .sw.dot{border-radius:50%}
  .count{margin-left:auto;color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
  .stats{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;
    color:var(--dim);font-size:11px}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .stats p{margin:0 0 7px}
  .warn{color:#ffb86b}
  .sub code{background:#21262d;padding:1px 4px;border-radius:3px;font-size:10.5px}
  #detail{position:absolute;top:12px;right:12px;width:330px;max-height:calc(100% - 24px);
    overflow-y:auto;z-index:3;background:rgba(22,27,34,.96);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;display:none}
  #detail h3{margin:0 0 8px;font-size:13px;padding-right:20px}
  #detail table{width:100%;border-collapse:collapse;font-size:11.5px}
  #detail td{padding:3px 0;vertical-align:top;border-bottom:1px solid #21262d}
  #detail td:first-child{color:var(--dim);width:44%;padding-right:8px}
  #detail a{color:#58a6ff}
  #close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--dim);
    background:none;border:0;font-size:16px}
  #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:9;
    background:var(--bg);color:var(--dim)}
  .btn{background:#21262d;border:1px solid var(--line);color:var(--ink);border-radius:5px;
    padding:5px 9px;cursor:pointer;font-size:11px;margin:2px 3px 2px 0}
  .btn:hover{background:#2d333b}
  .btn.on{background:#1f6feb;border-color:#1f6feb}
</style>
</head>
<body>
<div id="map"></div>
<div id="loading">loading ~13 MB of Copenhagen water data…</div>

<div class="panel">
  <h1>Copenhagen Waterways</h1>
  <div class="sub">Sewers, cloudburst infrastructure and discharge points, from open data</div>

  <div class="grp">
    <h2>View</h2>
    <button class="btn" id="b2d">2D</button>
    <button class="btn on" id="b3d">3D</button>
    <button class="btn" id="bfit">Reset</button>
    <div style="margin-top:7px">
      <span style="color:var(--dim);font-size:11px">Vertical exaggeration</span><br>
      <button class="btn exag" data-x="1">×1</button>
      <button class="btn exag on" data-x="25">×25</button>
      <button class="btn exag" data-x="100">×100</button>
      <div class="sub" id="exagnote" style="margin:4px 0 0">&nbsp;</div>
      <button class="btn" id="bexag" style="margin-top:5px">Show me one</button>
    </div>
  </div>

  <div class="grp" id="layers"></div>

  <div class="grp" id="extras"></div>

  <div class="grp">
    <h2>Highlight</h2>
    <label class="row"><input type="checkbox" id="undoc">
      <span>Only structures with no plan page</span></label>
    <div class="sub" style="margin:2px 0 0">Geometry the city draws but never describes.</div>
  </div>

  <div class="stats" id="stats"></div>
</div>

<div id="detail"><button id="close">×</button><div id="detail-body"></div></div>

<script>
const B = "../data/derived/viewer/";

// Layer definitions. `paint`/`type` are MapLibre; `sw` drives the legend swatch.
const LAYERS = [
  {id:"catchments", file:"catchments.geojson", group:"Context", label:"Cloudburst catchments",
   type:"line", on:false, sw:"#4d5b6a",
   paint:{"line-color":"#4d5b6a","line-width":1.4,"line-dasharray":[3,2]}},
  {id:"water", file:"water.geojson", group:"Context", label:"Lakes & watercourses",
   type:"fill", on:true, sw:"var(--water)",
   paint:{"fill-color":"#1b3a5c","fill-opacity":.85}},
  {id:"coast", file:"coast.geojson", group:"Context", label:"Coastline",
   type:"line", on:true, sw:"#2b4a6f",
   paint:{"line-color":"#2b4a6f","line-width":1}},

  {id:"sewer", file:"sewer_catchments.geojson", group:"Sewer system",
   label:"Sewer catchments", type:"fill", on:true, sw:"var(--combined)",
   paint:{"fill-color":["match",["get","kloaksystem_status"],
            "Fælleskloakeret","#e8734a",
            "Separatkloakeret","#4a9de8",
            "Spildevandskloakeret","#c9a227",
            "#3d444d"],
          "fill-opacity":.34}},
  {id:"sewer-line", file:"sewer_catchments.geojson", group:"Sewer system",
   label:"Catchment outlines", type:"line", on:false, sw:"#586069",
   paint:{"line-color":"#586069","line-width":.4}},

  {id:"tunnels", file:"tunnels_roads.geojson", group:"Cloudburst plan",
   label:"Cloudburst roads, pipes, tunnels", type:"line", on:true, sw:"var(--tunnel)",
   paint:{"line-color":"#b07ee0","line-width":["interpolate",["linear"],["zoom"],11,1,16,3.5],
          "line-opacity":.9}},
  {id:"terrain", file:"terrain_changes.geojson", group:"Cloudburst plan",
   label:"Planned terrain changes", type:"line", on:false, sw:"#d98b5f",
   paint:{"line-color":"#d98b5f","line-width":1.6}},
  {id:"basins-fill", file:"basins.geojson", group:"Cloudburst plan",
   label:"Basins & retention squares", type:"fill", on:true, sw:"var(--basin)",
   paint:{"fill-color":["case",["==",["get","_doc"],1],"#7ee0a8","#4a5a52"],
          "fill-opacity":.55}},
  {id:"basins-3d", file:"basins.geojson", group:"Cloudburst plan",
   label:"↳ extruded by claimed volume", type:"fill-extrusion", on:true, sw:"#3ddc97",
   filter:[">",["coalesce",["get","_depth_implied"],0],0],
   paint:{"fill-extrusion-color":"#3ddc97","fill-extrusion-opacity":.8,
          "fill-extrusion-height":["*",["coalesce",["get","_depth_implied"],0],25],
          "fill-extrusion-base":0}},

  {id:"rain-lines", file:"rain_lines.geojson", group:"Rainwater on the surface",
   label:"Swales & channels", type:"line", on:false, sw:"#5fd3bc",
   paint:{"line-color":"#5fd3bc","line-width":1.6}},
  {id:"lar", file:"lar.geojson", group:"Rainwater on the surface",
   label:"Local infiltration (LAR)", type:"fill", on:false, sw:"var(--lar)",
   paint:{"fill-color":"#5fd3bc","fill-opacity":.5}},

  {id:"outfalls", file:"discharge_points.geojson", group:"Where it comes out",
   label:"Discharge & overflow points", type:"circle", on:true, sw:"var(--outfall)", dot:true,
   paint:{"circle-color":["case",["in",["get","bgv_type"],["literal",["OV","OS","OF","OK"]]],
            "#ff5c7a","#4a9de8"],
          "circle-radius":["interpolate",["linear"],["zoom"],
            10,["case",[">",["coalesce",["get","vol_sb"],0],0],4,2],
            15,["case",[">",["coalesce",["get","vol_sb"],0],0],11,4]],
          "circle-stroke-color":"#0d1117","circle-stroke-width":.8,"circle-opacity":.92}},
  {id:"plants", file:"treatment_plants.geojson", group:"Where it comes out",
   label:"Treatment plants", type:"circle", on:true, sw:"var(--plant)", dot:true,
   paint:{"circle-color":"#ffd166","circle-radius":9,
          "circle-stroke-color":"#0d1117","circle-stroke-width":1.5}},
];

const map = new maplibregl.Map({
  container:"map",
  style:{version:8, sources:{}, layers:[{id:"bg",type:"background",paint:{"background-color":"#0d1117"}}]},
  center:[12.5655,55.6805], zoom:11.4, pitch:50, bearing:-17, maxPitch:75, antialias:true
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}),"bottom-left");

const counts = {};
let basinsData = null;   // kept so the exaggeration control can re-set the source data
const FLOOD = [];        // ids of the recovered flood-model raster layers

/** Rough polygon area in m2 (equirectangular shoelace) - only for scaling the extrusion. */
function ringArea(ring){
  const R=6378137, rad=Math.PI/180, lat0=ring[0][1]*rad;
  let a=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const x1=ring[j][0]*rad*R*Math.cos(lat0), y1=ring[j][1]*rad*R;
    const x2=ring[i][0]*rad*R*Math.cos(lat0), y2=ring[i][1]*rad*R;
    a += x1*y2 - x2*y1;
  }
  return Math.abs(a/2);
}
function featureArea(g){
  if(!g) return 0;
  if(g.type==="Polygon") return ringArea(g.coordinates[0]);
  if(g.type==="MultiPolygon") return g.coordinates.reduce((s,p)=>s+ringArea(p[0]),0);
  return 0;
}

/**
 * Attribute claimed volume to basin polygons.
 *
 * A klima_id is often drawn as several separate polygons - KV69 is six of them. The
 * plan states ONE volume for the project as a whole, so giving each polygon the full
 * figure would invent storage and produce nonsense depths (the same project reading
 * 1.4 m and 11.4 m). Split it by area share instead: every part of a project then
 * shows the same implied mean depth, which is the only defensible reading of a single
 * project-level number.
 */
function annotateBasins(fc, volumes){
  const areaByKid = {};
  for(const f of fc.features){
    const a = featureArea(f.geometry);
    f.properties._area_m2 = Math.round(a);
    const k = f.properties.klima_id;
    if(k) areaByKid[k] = (areaByKid[k] || 0) + a;
  }
  for(const f of fc.features){
    const k = f.properties.klima_id, v = volumes[k], total = areaByKid[k] || 0;
    const a = f.properties._area_m2;
    if(v && total > 50){
      f.properties._project_volume_m3 = v;
      f.properties._share_volume_m3 = Math.round(v * (a / total));
      f.properties._depth_implied = +(v / total).toFixed(2);  // identical for every part
      f.properties._parts = fc.features.filter(x => x.properties.klima_id === k).length;
    }else{
      f.properties._depth_implied = null;
    }
  }
  return fc;
}

async function load(){
  const cache = {};
  await Promise.all([...new Set(LAYERS.map(l=>l.file))].map(async f=>{
    const r = await fetch(B+f);
    if(!r.ok) throw new Error(f+": HTTP "+r.status);
    cache[f] = await r.json();
  }));

  // constructions.geojson carries the reconstructed prose->geometry join
  let volumes = {}, constructions = null;
  try{
    const r = await fetch(B+"constructions.geojson");
    if(r.ok){
      constructions = await r.json();
      for(const f of constructions.features){
        const p=f.properties;
        if(p.claimed_volume_m3) volumes[p.klima_id]=p.claimed_volume_m3;
      }
    }
  }catch(e){ console.warn("constructions.geojson not available", e); }

  basinsData = annotateBasins(cache["basins.geojson"], volumes);

  // documented / undocumented flag onto the basins and alignments
  const documented = new Set();
  if(constructions) for(const f of constructions.features)
    if(f.properties.documented) documented.add(f.properties.klima_id);
  for(const f of ["basins.geojson","tunnels_roads.geojson"])
    for(const ft of cache[f].features)
      ft.properties._doc = documented.has(ft.properties.klima_id) ? 1 : 0;

  for(const L of LAYERS){
    counts[L.id] = cache[L.file].features.length;
    if(!map.getSource(L.id)) map.addSource(L.id,{type:"geojson",data:cache[L.file]});
    const spec={id:L.id,source:L.id,type:L.type,paint:L.paint,
                layout:{visibility:L.on?"visible":"none"}};
    if(L.filter) spec.filter=L.filter;
    map.addLayer(spec);
  }
  applyExag();
  await loadExtras();
  buildUI();
  await loadStats();
  document.getElementById("loading").remove();
}

function buildUI(){
  const host=document.getElementById("layers"); host.innerHTML="";
  const groups=[...new Set(LAYERS.map(l=>l.group))];
  for(const g of groups){
    const d=document.createElement("div"); d.className="grp";
    d.innerHTML=`<h2>${g}</h2>`;
    for(const L of LAYERS.filter(x=>x.group===g)){
      const row=document.createElement("label"); row.className="row";
      const cls = L.dot?"sw dot":(L.type==="line"?"sw line":"sw");
      row.innerHTML=`<input type="checkbox" ${L.on?"checked":""}>
        <span class="${cls}" style="background:${L.sw}"></span>
        <span>${L.label}</span><span class="count">${counts[L.id].toLocaleString()}</span>`;
      row.querySelector("input").onchange=e=>
        map.setLayoutProperty(L.id,"visibility",e.target.checked?"visible":"none");
      d.appendChild(row);
    }
    host.appendChild(d);
  }
}

/**
 * The 2012 flood model, recovered from its PDFs, and the field observations meant to
 * check it. Both are optional: the overlays only exist once control points have been
 * set in georef.html, and observations only once someone has walked in the rain.
 */
/* ---------------------------------------------------------------- nudge mode ---
 * The sheets are placed to 58-91 m against the ground, and a person who knows the
 * city can see where they should be far faster than a correlation can. So: pick a
 * sheet, drag it, read off the offset. Nothing here writes to the dataset - it
 * produces the numbers, and scripts/apply_offsets.py is what applies them.
 *
 * Translation only. Scale and rotation are also wrong on some sheets, but a person
 * dragging can honestly judge a shift and cannot honestly judge a 2% scale error,
 * and a control that invites a judgement nobody can make is worse than no control.
 */
const NUDGE = {on:false, sheets:[], home:{}, off:{}, pick:null, drag:null,
               opacity:0.85};

function nudgeOffsetMetres(k){
  const o = NUDGE.off[k];
  if(!o) return {dx:0, dy:0};
  const lat = NUDGE.home[k][0][1] * Math.PI/180;
  return {dx: o[0] * 111320 * Math.cos(lat), dy: o[1] * 110540};
}

function nudgeSave(){
  const out = {};
  for(const k of NUDGE.sheets){
    const o = NUDGE.off[k];
    if(o && (Math.abs(o[0])>1e-9 || Math.abs(o[1])>1e-9)){
      const m = nudgeOffsetMetres(k);
      out[k] = {dlon:+o[0].toFixed(8), dlat:+o[1].toFixed(8),
                dx_m:+m.dx.toFixed(1), dy_m:+m.dy.toFixed(1)};
    }
  }
  try{ localStorage.setItem("floodNudge", JSON.stringify(out, null, 1)); }catch(e){}
  return out;
}

function nudgeApply(k){
  const src = map.getSource("flood-"+k);
  if(!src) return;
  const o = NUDGE.off[k] || [0,0];
  src.setCoordinates(NUDGE.home[k].map(c => [c[0]+o[0], c[1]+o[1]]));
  if(NUDGE.pick === k) nudgeOutline(k);
}

function nudgeOutline(k){
  const o = NUDGE.off[k] || [0,0];
  const ring = NUDGE.home[k].map(c => [c[0]+o[0], c[1]+o[1]]);
  ring.push(ring[0]);
  const data = {type:"Feature", geometry:{type:"LineString", coordinates:ring}};
  if(map.getSource("nudge-outline")) map.getSource("nudge-outline").setData(data);
  else{
    map.addSource("nudge-outline",{type:"geojson",data});
    map.addLayer({id:"nudge-outline",source:"nudge-outline",type:"line",
      paint:{"line-color":"#e8a33d","line-width":2,"line-dasharray":[3,2]}});
  }
}

function nudgeReport(){
  const box = document.getElementById("nudgebox");
  if(!box) return;
  const rows = NUDGE.sheets.map(k => {
    const m = nudgeOffsetMetres(k);
    const moved = Math.hypot(m.dx, m.dy) > 0.5;
    const sel = NUDGE.pick === k;
    return `<div style="display:flex;gap:6px;align-items:baseline;
      ${sel?"color:#e8a33d;font-weight:600":""}">
      <button data-nudge="${k}" style="all:unset;cursor:pointer;flex:1">${sel?"▸ ":"  "}${k}</button>
      <span style="font-variant-numeric:tabular-nums">${moved?`${m.dx>=0?"+":""}${m.dx.toFixed(0)} E, ${m.dy>=0?"+":""}${m.dy.toFixed(0)} N m`:"—"}</span></div>`;
  }).join("");
  /* You cannot line a sheet up against streets you cannot see through it, so the
     opacity control belongs here rather than in a preferences menu somewhere. */
  box.innerHTML = `<div style="margin-bottom:4px">Pick a sheet, then drag the map, or
    use the arrow keys (1 m, shift 10 m).</div>${rows}
    <label style="display:flex;gap:6px;align-items:center;margin-top:6px">
      <span>see-through</span>
      <input type="range" id="nudgeop" min="15" max="95" value="${Math.round(NUDGE.opacity*100)}"
        style="flex:1"></label>
    <div style="margin-top:6px;display:flex;gap:8px">
      <button id="nudgecopy" style="all:unset;cursor:pointer;color:#58a6ff">copy offsets</button>
      <button id="nudgereset" style="all:unset;cursor:pointer;color:#8b949e">reset all</button>
    </div><div id="nudgecopied" class="sub"></div>`;
  const op = document.getElementById("nudgeop");
  op.oninput = () => {
    NUDGE.opacity = +op.value/100;
    for(const k of NUDGE.sheets)
      if(map.getLayer("flood-"+k))
        map.setPaintProperty("flood-"+k,"raster-opacity",NUDGE.opacity);
  };
  box.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => {
    NUDGE.pick = b.dataset.nudge;
    nudgeOutline(NUDGE.pick);
    nudgeReport();
  });
  document.getElementById("nudgecopy").onclick = () => {
    const out = nudgeSave();
    const box = document.getElementById("nudgecopied");
    if(!Object.keys(out).length){ box.textContent = "nothing moved yet"; return; }
    const text = JSON.stringify(out, null, 1);
    navigator.clipboard?.writeText(text).catch(()=>{});
    /* Clipboard access can be refused, and this is the one number that has to
       survive the trip out of the browser - so show it as selectable text too. */
    box.innerHTML = "<div>paste this back to have it applied</div>" +
      "<textarea readonly style=\"width:100%;height:110px;background:#0d1117;" +
      "color:#c9d1d9;border:1px solid #30363d;font:11px/1.4 monospace\"></textarea>";
    const ta = box.querySelector("textarea");
    ta.value = text; ta.focus(); ta.select();
  };
  document.getElementById("nudgereset").onclick = () => {
    NUDGE.off = {};
    for(const k of NUDGE.sheets) nudgeApply(k);
    nudgeReport();
    nudgeSave();
  };
}

function nudgeInit(){
  const cb = document.getElementById("nudgemode");
  if(!cb) return;
  cb.onchange = () => {
    NUDGE.on = cb.checked;
    document.getElementById("nudgebox").style.display = NUDGE.on ? "block" : "none";
    if(NUDGE.on){
      NUDGE.pick = NUDGE.pick || NUDGE.sheets[0];
      nudgeOutline(NUDGE.pick);
      nudgeReport();
      for(const k of NUDGE.sheets)
        if(map.getLayer("flood-"+k))
          map.setPaintProperty("flood-"+k,"raster-opacity",NUDGE.opacity);
    }else{
      for(const k of NUDGE.sheets)
        if(map.getLayer("flood-"+k))
          map.setPaintProperty("flood-"+k,"raster-opacity",0.85);
    }
    if(map.getLayer("nudge-outline"))
      map.setLayoutProperty("nudge-outline","visibility", NUDGE.on ? "visible" : "none");
  };
  const canvas = map.getCanvas();
  canvas.addEventListener("mousedown", e => {
    if(!NUDGE.on || !NUDGE.pick) return;
    NUDGE.drag = map.unproject([e.offsetX, e.offsetY]);
    map.dragPan.disable();
  });
  canvas.addEventListener("mousemove", e => {
    if(!NUDGE.drag) return;
    const now = map.unproject([e.offsetX, e.offsetY]);
    const k = NUDGE.pick, o = NUDGE.off[k] || [0,0];
    NUDGE.off[k] = [o[0] + (now.lng - NUDGE.drag.lng), o[1] + (now.lat - NUDGE.drag.lat)];
    NUDGE.drag = now;
    nudgeApply(k);
    nudgeReport();
    nudgeSave();
  });
  window.addEventListener("mouseup", () => {
    if(!NUDGE.drag) return;
    NUDGE.drag = null;
    map.dragPan.enable();
  });
  window.addEventListener("keydown", e => {
    if(!NUDGE.on || !NUDGE.pick) return;
    if(/^(INPUT|TEXTAREA)$/.test((e.target.tagName||""))) return;
    const m = e.shiftKey ? 10 : 1;                    // metres per press
    const lat = NUDGE.home[NUDGE.pick][0][1] * Math.PI/180;
    const sy = m/110540, sx = m/(111320*Math.cos(lat));
    const d = {ArrowLeft:[-sx,0], ArrowRight:[sx,0],
               ArrowUp:[0,sy], ArrowDown:[0,-sy]}[e.key];
    if(!d) return;
    e.preventDefault();
    const k = NUDGE.pick, o = NUDGE.off[k] || [0,0];
    NUDGE.off[k] = [o[0]+d[0], o[1]+d[1]];
    nudgeApply(k);
    nudgeReport();
    nudgeSave();
  });
  // survive a reload: a person adjusting seven sheets should not lose six of them
  try{
    const saved = JSON.parse(localStorage.getItem("floodNudge") || "{}");
    for(const [k,v] of Object.entries(saved))
      if(NUDGE.home[k]){ NUDGE.off[k] = [v.dlon, v.dlat]; nudgeApply(k); }
  }catch(e){}
}

async function loadExtras(){
  const host=document.getElementById("extras");
  let rows="<h2>Recovered flood model (2012)</h2>";

  let geo=null;
  try{ const r=await fetch(B+"floodmaps.json"); if(r.ok) geo=await r.json(); }catch(e){}
  const sheets=geo?Object.keys(geo):[];
  if(!sheets.length){
    rows+=`<div class="sub">Not georeferenced yet. Run <code>floodmaps.py render extract</code>,
      set two control points per sheet in <a href="georef.html" style="color:#58a6ff">georef.html</a>,
      then <code>floodmaps.py georef</code>.</div>`;
  }else{
    for(const k of sheets){
      const g=geo[k];
      /* The display copy, not the dataset: a quarter of the linear size, which is
         still finer than the 10 m grid the model was computed on. Loading all seven
         at full size is 193 MB of texture and it is what made this viewer crawl.
         scripts/flood_web.py writes these; the full sheets stay for QGIS. */
      map.addSource("flood-"+k,{type:"image",url:B+k+".depth.web.png",coordinates:g.corners_for_maplibre});
      map.addLayer({id:"flood-"+k,source:"flood-"+k,type:"raster",
        paint:{"raster-opacity":.85},layout:{visibility:"visible"}});
      FLOOD.push("flood-"+k);
    }
    rows+=`<label class="row"><input type="checkbox" id="floodtoggle" checked>
      <span class="sw" style="background:#4a9de8"></span><span>Modelled flood depth</span>
      <span class="count">${sheets.length} sheets</span></label>
      <div class="sub" style="margin:2px 0 0">100-year event, 2012 calculations,
      recovered from PDF. ${sheets.join(", ")}.</div>
      <label class="row"><input type="checkbox" id="nudgemode">
      <span class="sw" style="background:#e8a33d"></span><span>Move sheets (debug)</span></label>
      <div id="nudgebox" class="sub" style="display:none;margin:4px 0 0"></div>`;
    NUDGE.sheets = sheets;
    NUDGE.home = Object.fromEntries(sheets.map(k =>
      [k, geo[k].corners_for_maplibre.map(c => c.slice())]));
  }

  let spots=null;
  try{ const r=await fetch(B+"flood_hotspots.geojson"); if(r.ok) spots=await r.json(); }catch(e){}
  if(spots&&spots.features.length){
    map.addSource("hotspots",{type:"geojson",data:spots});
    map.addLayer({id:"hotspots",source:"hotspots",type:"circle",paint:{
      "circle-color":"#ff5c7a","circle-opacity":.25,
      "circle-radius":["interpolate",["linear"],["zoom"],
        11,["*",["sqrt",["get","area_m2"]],0.03],
        16,["*",["sqrt",["get","area_m2"]],0.9]],
      "circle-stroke-color":"#ff5c7a","circle-stroke-width":1.6}});
    rows+=`<label class="row"><input type="checkbox" id="spottoggle" checked>
      <span class="sw dot" style="background:#ff5c7a"></span><span>Deep &amp; nothing planned</span>
      <span class="count">${spots.features.length}</span></label>
      <div class="sub" style="margin:2px 0 0">Modelled ≥0.2 m, &gt;100 m from any planned work.</div>`;
  }

  let obs=null;
  try{ const r=await fetch(B+"observations.geojson"); if(r.ok) obs=await r.json(); }catch(e){}
  rows+="<h2 style='margin-top:12px'>Field observations</h2>";
  if(!obs||!obs.features.length){
    rows+=`<div class="sub">Nothing logged yet. Walk with
      <a href="log.html" style="color:#58a6ff">log.html</a> open on your phone, then
      <code>observations.py import</code>. This is the layer no dataset has.</div>`;
  }else{
    map.addSource("obs",{type:"geojson",data:obs});
    map.addLayer({id:"obs",source:"obs",type:"circle",paint:{
      "circle-color":["match",["get","depth_class"],
        "dry","#6e7681","<0.05","#d1e2f2","0.05-0.1","#9ac7e0",
        "0.1-0.2","#519ccc","0.2-0.5","#1c6bb0","0.5-1","#08306b",">1","#4c0519","#888"],
      "circle-radius":["interpolate",["linear"],["zoom"],10,4,16,12],
      "circle-stroke-width":["case",["==",["get","drain"],"surcharging"],2.5,1],
      "circle-stroke-color":["case",["==",["get","drain"],"surcharging"],"#ff5c7a","#0d1117"]}});
    const sur=obs.features.filter(f=>f.properties.drain==="surcharging").length;
    rows+=`<label class="row"><input type="checkbox" id="obstoggle" checked>
      <span class="sw dot" style="background:#519ccc"></span><span>Observed water</span>
      <span class="count">${obs.features.length}</span></label>`;
    if(sur) rows+=`<div class="sub warn" style="margin:2px 0 0">${sur} drain(s) observed
      surcharging — water leaving the pipe upward.</div>`;
  }
  host.innerHTML=rows;

  const ft=document.getElementById("floodtoggle");
  if(ft) ft.onchange=e=>FLOOD.forEach(id=>
    map.setLayoutProperty(id,"visibility",e.target.checked?"visible":"none"));
  const st=document.getElementById("spottoggle");
  if(st) st.onchange=e=>
    map.setLayoutProperty("hotspots","visibility",e.target.checked?"visible":"none");
  const ot=document.getElementById("obstoggle");
  if(ot) ot.onchange=e=>
    map.setLayoutProperty("obs","visibility",e.target.checked?"visible":"none");
  nudgeInit();
}

async function loadStats(){
  let reg=null;
  try{ const r=await fetch("../data/derived/registry.json"); if(r.ok) reg=await r.json(); }
  catch(e){}
  const el=document.getElementById("stats");
  if(!reg){ el.innerHTML="<p>registry.json not built yet.</p>"; return; }
  const c=reg.counts, n=x=>x.toLocaleString();
  el.innerHTML=`
    <p><b>${n(c.plan_projects)}</b> plan project pages, <b>${n(c.plan_projects_with_geometry)}</b> linked to geometry.</p>
    <p><b>${n(c.unique_klima_id_with_geometry)}</b> mapped structures; <b class="warn">${n(c.klima_id_with_geometry_but_no_plan_page)}</b> of them have no plan page.</p>
    <p>Claimed storage, attributable: <b>${n(c.storage_m3_attributable)} m³</b>.
       A further <b>${n(c.storage_m3_shared_attribution)} m³</b> is stated on pages naming several structures, so it is not assigned.</p>
    <p>Stated annual discharge: <b>${n(c.annual_flow_m3_per_year)} m³/year</b> — a rate, not storage.</p>
    <p style="color:#6e7681">Extrusion height = claimed volume ÷ total project footprint = implied mean depth,
       exaggerated by the factor selected above. Most are shallow surface detention (0.1–0.6 m), not tanks —
       a &ldquo;basin&rdquo; here is usually a square or park graded down by tens of centimetres, which is why
       the exaggeration exists at all.
       <b>Only 13 of ${n(c.plan_projects)} plan pages state a storage volume</b>, and only 8 of those name a
       single structure, so almost every basin is drawn flat and grey for want of a number.</p>`;
}

// ---- interaction -------------------------------------------------------------
const DETAIL=document.getElementById("detail"), BODY=document.getElementById("detail-body");
document.getElementById("close").onclick=()=>DETAIL.style.display="none";

const HIDE=new Set(["_h","_doc","_exag"]);
const NICE={kloaksystem_status:"Sewer system (now)",kloaksystem_plan:"Sewer system (planned)",
  renseanlaeg:"Treatment plant",befgrad_status:"Impervious fraction",label:"Catchment",
  klima_id:"Cloudburst id",projekt_navn:"Project",typologi:"Type",vandopland:"Catchment",
  forventet_ibrugtagning:"Expected in use",pkt_navn:"Structure id",bgv_type:"Structure type",
  vol_sb:"Detention basin (m³)",vol_fbas:"Retention basin (m³)",komm_navn:"Municipality",
  godk_pe:"Capacity (PE)",rens_sta:"Treatment stage",_area_m2:"Footprint (m²)",
  area_m2:"Area (m²)",max_depth_band:"Deepest modelled band (m)",
  implied_volume_m3:"Implied volume (m³)",
  distance_to_nearest_planned_work_m:"Nearest planned work (m)",
  observed_at:"Observed",accuracy_m:"GPS accuracy (m)",depth_class:"Observed depth (m)",
  flow:"Flow",drain:"Drain",rain:"Rain",note:"Note",
  _project_volume_m3:"Claimed volume, whole project (m³)",
  _share_volume_m3:"This polygon's area share (m³)",
  _depth_implied:"Implied mean depth (m)",_parts:"Polygons in this project"};

map.on("click",e=>{
  const ids=LAYERS.filter(L=>map.getLayoutProperty(L.id,"visibility")!=="none").map(L=>L.id);
  for(const extra of ["obs","hotspots"])
    if(map.getLayer(extra)&&map.getLayoutProperty(extra,"visibility")!=="none") ids.unshift(extra);
  const hits=map.queryRenderedFeatures(e.point,{layers:ids});
  if(!hits.length){ DETAIL.style.display="none"; return; }
  const f=hits[0], p=f.properties;
  const NAMED={obs:"Field observation",hotspots:"Deep water, nothing planned nearby"};
  const L=LAYERS.find(x=>x.id===f.layer.id)||(NAMED[f.layer.id]?{label:NAMED[f.layer.id]}:null);
  let rows="";
  for(const[k,v]of Object.entries(p)){
    if(HIDE.has(k)||v===null||v===""||v==="null") continue;
    rows+=`<tr><td>${NICE[k]||k}</td><td>${
      typeof v==="number"?v.toLocaleString():String(v)}</td></tr>`;
  }
  let links="";
  if(p.klima_id){
    links=`<p style="margin:9px 0 0"><a href="https://planer.kk.dk/spildevandsplan-2018/projekter/"
      target="_blank" rel="noopener">Spildevandsplan 2018 project register</a></p>`;
  }
  BODY.innerHTML=`<h3>${L?L.label:f.layer.id}</h3><table>${rows}</table>${links}`;
  DETAIL.style.display="block";
});
map.on("mouseenter","outfalls",()=>map.getCanvas().style.cursor="pointer");
map.on("mouseleave","outfalls",()=>map.getCanvas().style.cursor="");

document.getElementById("undoc").onchange=e=>{
  const flt=e.target.checked?["==",["get","_doc"],0]:null;
  map.setFilter("basins-fill", flt);
  map.setFilter("tunnels", flt);
  map.setFilter("basins-3d", e.target.checked
    ? ["all", ["==",["get","_doc"],0], [">",["coalesce",["get","_depth_implied"],0],0]]
    : [">",["coalesce",["get","_depth_implied"],0],0]);
};
const b2d=document.getElementById("b2d"), b3d=document.getElementById("b3d");
b2d.onclick=()=>{map.easeTo({pitch:0,bearing:0});b2d.classList.add("on");b3d.classList.remove("on");};
b3d.onclick=()=>{map.easeTo({pitch:55,bearing:-17});b3d.classList.add("on");b2d.classList.remove("on");};
let EXAG = 25;
// The extruded basins: only those with a claimed volume AND a footprint to divide it by.
// There are far fewer than people expect, which is most of why this control used to look
// broken - it was working on 16 polygons out of 176, none of them tall.
function extrudable(){
  if(!basinsData) return [];
  return basinsData.features.filter(f => (f.properties._depth_implied || 0) > 0);
}
function applyExag(){
  if(!map.getLayer("basins-3d")) return;
  // A paint property, not a source rewrite: instant, and it cannot silently no-op.
  map.setPaintProperty("basins-3d", "fill-extrusion-height",
    ["*", ["coalesce", ["get","_depth_implied"], 0], EXAG]);
  const ex = extrudable(), note = document.getElementById("exagnote");
  if(!note) return;
  if(!ex.length){ note.textContent = "No basin has an attributable volume."; return; }
  const d = ex.map(f => f.properties._depth_implied).sort((a,b)=>a-b);
  const med = d[Math.floor(d.length/2)], max = d[d.length-1];
  note.innerHTML = `<b>${ex.length}</b> of ${basinsData.features.length} basins are `
    + `extruded — the rest have no stated volume.<br>`
    + `Implied depth ${med.toFixed(2)}–${max.toFixed(2)} m, drawn as `
    + `<b>${(med*EXAG).toFixed(0)}–${(max*EXAG).toFixed(0)} m</b>.`;
}
for(const b of document.querySelectorAll(".exag")) b.onclick=()=>{
  EXAG = +b.dataset.x;
  document.querySelectorAll(".exag").forEach(x=>x.classList.toggle("on", x===b));
  applyExag();
};
// Fly to the deepest one, because at city zoom a 9 m block is a few pixels.
document.getElementById("bexag").onclick=()=>{
  const ex = extrudable();
  if(!ex.length) return;
  ex.sort((a,b)=> b.properties._depth_implied - a.properties._depth_implied);
  const f = ex[0];
  let sx=0, sy=0, n=0;
  (function walk(c){ if(typeof c[0]==="number"){sx+=c[0];sy+=c[1];n++;} else c.forEach(walk); })
    (f.geometry.coordinates);
  map.easeTo({center:[sx/n, sy/n], zoom:16.5, pitch:62, bearing:-17, duration:1400});
  map.setLayoutProperty("basins-3d","visibility","visible");
};

document.getElementById("bfit").onclick=()=>
  map.easeTo({center:[12.5655,55.6805],zoom:11.4,pitch:50,bearing:-17});

map.on("load",()=>load().catch(err=>{
  document.getElementById("loading").innerHTML=
    `<div style="text-align:center;max-width:460px;padding:20px">
       <p style="color:#ff7b72">Could not load the data bundle.</p>
       <p style="font-size:12px">${err.message}</p>
       <p style="font-size:12px">Serve the project over HTTP — <code>file://</code> blocks fetch.<br>
       <code>cd copenhagen-waterways &amp;&amp; python3 -m http.server 8000</code><br>
       then open <code>http://localhost:8000/viz/</code></p></div>`;
}));
</script>
